[project]
name = "field-shift-backend"
version = "0.3.7"
description = "Leyar Shift rotation API: compares crop rotations for one field from NASA Earth observations and local records."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "numpy>=2.0",
    "rasterio>=1.4",
    "pyproj>=3.6",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "defusedxml>=0.7.1",
    "vercel>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.23",
    "openapi-spec-validator>=0.7",
]
ingest = [
    "h5py>=3.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["../development/tests/backend"]
cache_dir = ".pytest_cache"
addopts = "-q"
